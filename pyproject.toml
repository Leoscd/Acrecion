[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "aiaudit"
version = "0.1.0"
description = "Pipeline de diagnostico de procesos e integracion de IA para empresas"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.27",
  "pydantic>=2.14",
  "pyyaml>=6.0",
  "python-dotenv>=1.2",
  "rich>=13",
  "jinja2>=3.1",
  "python-docx>=1.2",
  "pandas>=3.0",
  "openpyxl>=3.1",
  "tabulate>=0.9",
  "markitdown[all]>=0.1.9",
]

[project.optional-dependencies]
llm      = ["openai>=3.41"]
docs     = ["docling>=2.144"]
comms    = ["extract-msg>=0.57", "mail-parser>=4.9", "whatstk>=0.10"]
media    = ["faster-whisper>=1.2", "rapidocr-onnxruntime>=1.2"]
mining   = ["pm4py>=2.7"]
privacy  = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
magic    = ["python-magic>=0.4.27"]
dev      = ["pytest>=8", "reportlab>=4"]
all      = ["aiaudit[llm,docs,comms,media,mining,privacy,magic]"]

[project.scripts]
aiaudit = "aiaudit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiaudit = ["report/templates/*"]
